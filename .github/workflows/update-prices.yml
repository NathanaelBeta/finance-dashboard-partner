name: Update prices.json

on:
  schedule:
    # Runs at 18:00 UTC daily = midnight WIB (UTC+7) — after all markets close
    # IDX closes 16:00 WIB, NYSE closes 23:00 WIB, crypto 24/7
    - cron: "0 18 * * *"
  workflow_dispatch:   # also allow manual trigger from GitHub UI

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit prices.json back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Fetch prices
        run: python scripts/fetch_prices.py

      - name: Commit prices.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          # Only commit if the file actually changed
          git diff --cached --quiet || git commit -m "chore: update prices.json [$(date -u +%Y-%m-%d)]"
          git push
